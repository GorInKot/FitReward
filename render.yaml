services:
  - type: web
    name: fitreward-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm --workspace backend run build
    startCommand: npm --workspace backend run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
